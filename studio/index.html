/* short aliases used by the renderer + SVG */
:root{--bg:var(--ds-bg);--surface:var(--ds-bg-elevated);--ink:var(--ds-text);--ink-2:var(--ds-text-secondary);--muted:var(--ds-text-tertiary);--line:var(--ds-hairline);--line-2:var(--ds-hairline-strong);

*,*::before,*::after{box-sizing:border-box}
html.ds-page{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--ds-nav-h) + 16px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 15px/1.5 var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
::selection{background:var(--accent);color:var(--ds-accent-ink)}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--ds-accent-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
code{font-family:var(--mono);font-size:.88em;background:var(--ds-surface-3);color:var(--ink);padding:.1em .4em;border-radius:6px}
.wrap{width:min(var(--maxw),calc(100% - var(--ds-gutter)*2));margin-inline:auto}
/* frosted sticky nav */
.nav{position:sticky;top:0;z-index:40;height:var(--ds-nav-h);background:var(--ds-nav-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;transition:border-color var(--ds-duration) var(--ds-ease)}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-inner{width:min(var(--maxw),calc(100% - var(--ds-gutter)*2));margin:0 auto;height:100%;display:flex;align-items:center;gap:20px}
.brand{display:inline-flex;align-items:baseline;gap:6px;font:600 15px/1 var(--display);letter-spacing:-.022em;white-space:nowrap;color:var(--ink)}.brand .en-name{color:var(--ink-2);font-weight:400}
.nav nav{display:flex;align-items:center;gap:18px;margin-left:auto;font-size:12px;letter-spacing:-.01em;white-space:nowrap;overflow-x:auto;scrollbar-width:none}.nav nav::-webkit-scrollbar{display:none}
.nav nav a{color:var(--ink-2);transition:color var(--ds-duration) var(--ds-ease)}.nav nav a:hover{color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}.nav nav:not(:empty)+.tools{margin-left:0}
.tools button{font:500 12px/1 var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line-2);border-radius:var(--ds-radius-pill);height:28px;min-width:28px;padding:0 9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:border-color var(--ds-duration) var(--ds-ease),color var(--ds-duration) var(--ds-ease)}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.i-sun{display:none}:root[data-theme=dark] .i-sun{display:block}:root[data-theme=dark] .i-moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .i-sun{display:block}:root:not([data-theme=light]) .i-moon{display:none}}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--ds-radius-pill);font-size:11px;font-weight:500;white-space:nowrap;background:var(--ds-surface-3);color:var(--ink-2)}
.badge.private{background:var(--neg-soft);color:var(--neg)}.badge.public{background:var(--accent-soft);color:var(--accent)}
/* hero */
.hero{padding:64px 0 28px}
.kicker{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.2vw,52px);line-height:1.1;letter-spacing:-.03em;margin:0 0 14px;max-width:22em;text-wrap:balance}
.lede{font-size:21px;line-height:1.38;letter-spacing:-.022em;color:var(--ink-2);margin:0 0 12px;max-width:44em}
.meta{font-size:13px;color:var(--muted);margin:0}
/* controls bar */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 14px 12px 18px;margin:0 0 24px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--ds-radius-md);box-shadow:var(--ds-shadow-1)}
.controls label{display:flex;gap:8px;align-items:center;color:var(--ink-2);font-weight:500;white-space:nowrap}
.controls select,.controls input{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:var(--ds-radius-pill);height:30px;padding:0 12px;transition:border-color var(--ds-duration) var(--ds-ease)}
.controls select{-webkit-appearance:none;appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 15px) 13px,calc(100% - 11px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.controls select:hover,.controls input:hover,.controls select:focus,.controls input:focus{border-color:var(--accent);outline:none}
.seg{display:inline-flex;padding:2px;background:var(--ds-surface-3);border-radius:var(--ds-radius-pill)}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--ink-2);height:26px;padding:0 14px;border-radius:var(--ds-radius-pill);cursor:pointer;transition:background var(--ds-duration) var(--ds-ease),color var(--ds-duration) var(--ds-ease)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.btn{font:500 13px/1 var(--sans);letter-spacing:-.01em;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--ds-radius-pill);height:30px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color var(--ds-duration) var(--ds-ease),color var(--ds-duration) var(--ds-ease),background var(--ds-duration) var(--ds-ease)}
.btn:hover{color:var(--accent);border-color:var(--accent)}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--ds-accent-ink)}.btn.fill:hover{background:var(--ds-accent-hover);color:var(--ds-accent-ink)}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.tile{grid-column:span var(--w,6);background:var(--surface);border:1px solid var(--line);border-radius:var(--ds-radius-lg);box-shadow:var(--ds-shadow-1);padding:24px 26px 16px;display:flex;flex-direction:column;min-width:0;transition:box-shadow var(--ds-duration) var(--ds-ease),border-color var(--ds-duration) var(--ds-ease)}
.tile:hover{box-shadow:var(--ds-shadow-2);border-color:var(--line-2)}
@media (max-width:860px){.tile{grid-column:span 12!important}}
@media (min-width:861px) and (max-width:1100px){.tile.kpi{grid-column:span 6!important}}
.tile h2{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.3;letter-spacing:-.022em;margin:0 0 4px}
.tile.kpi h2{font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:-.01em;line-height:1.4}
.tile .sub{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.tile .body{flex:1;min-width:0}
.tile .tf{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-top:1px solid var(--line);margin-top:16px;padding-top:12px;font-size:12px;color:var(--muted)}
.tile .tf .sp{flex:1}.tile .tf button{font:500 12px/1 var(--sans);background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0}.tile .tf button:hover{color:var(--ds-accent-hover)}
.q{display:none;margin-top:10px}.q.open{display:block}
pre{font:12.5px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:var(--ds-radius-sm);padding:12px 14px;overflow:auto;white-space:pre-wrap;margin:6px 0;color:var(--ink)}
.q ul{margin:4px 0 0;padding-left:18px;font-size:12px;color:var(--ink-2);word-break:break-all}
.kpi .v{font-family:var(--display);font-size:44px;line-height:1.05;font-weight:600;letter-spacing:-.03em;margin:10px 0 6px;display:inline-block;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:17px;font-weight:500;color:var(--ink-2);letter-spacing:-.01em}
.kpi .d{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--ds-radius-pill);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--ds-surface-3);color:var(--ink-2)}
.kpi .d.up{background:var(--accent-soft);color:var(--accent)}.kpi .d.dn{background:var(--neg-soft);color:var(--neg)}
.up{color:var(--accent)}.dn{color:var(--neg)}
[data-n]{cursor:pointer;border-radius:6px;transition:background var(--ds-duration) var(--ds-ease)}[data-n]:hover{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
svg [data-n]:hover{box-shadow:none;opacity:.78}
svg text{font-family:var(--sans);fill:var(--ink-2);letter-spacing:0}svg .ax{stroke:var(--line-2)}svg .gl{stroke:var(--line)}svg text.tl{fill:var(--muted)}svg text.vl{fill:var(--ink);font-weight:500}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:left;color:var(--ink-2);border-bottom:1px solid var(--line-2);padding:10px 12px;white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:1}
td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top}td.n{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:color-mix(in srgb,var(--ds-surface-3) 45%,transparent)}
.tw{max-height:420px;overflow:auto;margin:0 -8px;border-radius:var(--ds-radius-sm)}
.chip{display:inline-flex;align-items:center;height:22px;font-size:12px;font-weight:500;padding:0 9px;border-radius:var(--ds-radius-pill);white-space:nowrap;background:var(--ds-surface-3);color:var(--ink)}
.chip.s-未证实,.chip.s-未交付,.chip.s-未上线{color:var(--neg);background:var(--neg-soft)}
.chip.s-已辟谣{color:var(--muted);text-decoration:line-through}.chip.s-部分证实{color:var(--accent);background:transparent;box-shadow:inset 0 0 0 1px var(--accent)}
.chip.s-已证实,.chip.s-已交付{color:var(--accent);background:var(--accent-soft)}
.na{color:var(--muted);font-style:normal}
.err{border:0;background:var(--neg-soft);color:var(--ink);border-radius:var(--ds-radius-sm);padding:10px 14px;font-size:13px;margin-bottom:10px}
.empty{color:var(--muted);font-size:14px;padding:22px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-2);margin-top:8px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.textt p{margin:0 0 10px;font-size:15px;line-height:1.6;color:var(--ink)}
/* popover */
.pop{position:fixed;z-index:60;width:min(440px,92vw);max-height:76vh;overflow:auto;background:var(--ds-pop-bg);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--line);border-radius:var(--ds-radius-md);box-shadow:var(--ds-shadow-3);padding:18px 20px 16px;font-size:13px}
.pop h3{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.35;letter-spacing:-.016em;margin:0 0 4px;color:var(--ink-2)}
.pop .pv{font-family:var(--display);font-weight:600;font-size:32px;letter-spacing:-.03em;line-height:1.1;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:8px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.pop dt{color:var(--muted)}.pop dd{margin:0;word-break:break-all}
.pop pre{background:color-mix(in srgb,var(--bg) 70%,transparent)}
.pop .row{font-size:12px;color:var(--ink-2)}.pop .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.foot{border-top:1px solid var(--line);margin-top:48px;padding:22px 0 48px;font-size:12px;line-height:1.6;color:var(--muted)}
@media (max-width:734px){.hero{padding:36px 0 20px}.lede{font-size:17px}.brand .en-name{display:none}.nav-inner{gap:14px}.tile{padding:20px 18px 14px;border-radius:22px}
 .kpi .v{font-size:38px}.controls{border-radius:var(--ds-radius-md);padding:12px}.controls>span[style]{display:none}.controls input[type=date]{width:128px;padding:0 8px}.controls label{gap:6px}.grid{gap:14px}}
@media print{.nav,.controls,.pop{display:none}.tile{box-shadow:none;break-inside:avoid}}

</style>

function fmt(v,k){if(v==null||v==='')return null;if(typeof v==='number'){
  if(k==='pct'||k==='+pct')return (v>0?'+':'')+v.toFixed(2)+'%';if(k==='bp')return (v>0?'+':'')+v.toFixed(1)+'bp';
  if(/^d\d$/.test(k||''))return v.toLocaleString('en-US',{minimumFractionDigits:+k[1],maximumFractionDigits:+k[1]});if(k==='int')return Math.round(v).toLocaleString('en-US');if(k==='plain')return String(v);
  return Math.abs(v)>=1e6?v.toLocaleString('en-US',{maximumFractionDigits:0}):v.toLocaleString('en-US',{maximumFractionDigits:2});}

function objs(t){return t.rows.map(r=>{const o={};t.columns.forEach((c,i)=>o[c]=r[i]);return o})}
function isoWeek(s){const d=new Date(String(s).slice(0,10)+'T00:00:00Z');if(isNaN(d))return s;const t=new Date(d);const day=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-day+3);
  const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));const w=1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7);return t.getUTCFullYear()+'-W'+String(w).padStart(2,'0')}
function applies(t,f){const L=t.opts.filters;return (L?L.includes(f.id):true)&&t.columns.includes(f.column)}
function view(t){let rows=objs(t);
  for(const f of D.filters){if(!applies(t,f))continue;const v=S.filters[f.id];

    const agg=t.opts.agg||'last';const g=new Map();

      const key=wk+'|'+dims.map(c=>r[c]).join('|');if(!g.has(key))g.set(key,{wk,rows:[]});g.get(key).rows.push(r)}
    rows=[...g.values()].map(({wk,rows:rs})=>{const o=Object.assign({},rs[rs.length-1]);o[x]=wk;
      for(const c of t.columns){if(c.startsWith('_')||c===x)continue;const nums=rs.map(r=>r[c]).filter(v=>typeof v==='number');
        if(!nums.length)continue;o[c]=agg==='sum'?nums.reduce((a,b)=>a+b,0):agg==='avg'?nums.reduce((a,b)=>a+b,0)/nums.length:agg==='count'?nums.length:agg==='max'?Math.max(...nums):agg==='min'?Math.min(...nums):nums[nums.length-1]}

function cell(ti,ri,col,v,f){const s=fmt(v,f);return s==null?num(ti,ri,col,'取不到','na'):num(ti,ri,col,esc(s))}
function kpi(t,ti,rows){if(!rows.length)return '<div class="empty">取不到：查询没有返回行</div>';const r=rows[0],o=t.opts;
  const v=fmt(r[o.value],o.fmt);let h='<div class="kpi">'+num(ti,0,o.value,v==null?'取不到':esc(v)+(o.unit?'<small> '+esc(o.unit)+'</small>':''),'v'+(v==null?' na':''));

  const W=Math.max(640,110*(o.w||6)),H=250,L=56,R=16,T=10,B=28;const sx=i=>xs.length<2?(L+W-R)/2:L+i*(W-L-R)/(xs.length-1);const sy=v=>T+(mx-v)/(mx-mn)*(H-T-B);

    return '<td>'+(v==null?num(ti,ri,c.col,'取不到','na'):esc(v))+'</td>'}).join('')+'</tr>'});
  return h+'</tbody></table></div>'}
function text(t,ti,rows){const tx=t.text||'';if(!tx)return '<div class="empty">取不到</div>';return '<div class="textt">'+tx.split(/\n\s*\n/).map(p=>'<p>'+num(ti,0,(t.columns[0]||''),esc(p))+'</p>').join('')+'</div>'}
const R={kpi,bar,line,table,text};
function hm(s){return s?String(s).slice(5,16):'取不到'}
function drawTile(t,ti){const rows=view(t);VIEWS[ti]=rows;if(t.opts.hidden)return;const el=document.getElementById('tile-'+t.id);
  let b='';if(t.error)b+='<div class="err">查询失败：'+esc(t.error)+(t.rows&&t.rows.length?'<br>下面是上次成功的结果（'+esc(hm(t.last_ok))+'）。':'')+'</div>';
  if(!t.error||t.rows.length)b+=R[t.type](t,ti,rows);
  el.querySelector('.body').innerHTML=b;
  const note=(t.opts.grain&&S.grain==='weekly')?' · 周视图':'';el.querySelector('.cnt').textContent=(t.type==='text'?'':rows.length+' 行')+note}
function tileShell(t,ti){if(t.opts.hidden)return '';const w=t.opts.w||({kpi:3,text:12,table:12}[t.type]||6);
  const src=(t.sources||[]).map(s=>'<li>'+esc(s.label)+(PRIV&&s.path?' — <code>'+esc(s.path)+'</code>':'')+'</li>').join('')||'<li>取不到</li>';
  return '<article class="tile '+t.type+'" id="tile-'+esc(t.id)+'" style="--w:'+w+'"><h2>'+esc(t.title||t.id)+'</h2>'+(t.subtitle?'<p class="sub">'+esc(t.subtitle)+'</p>':'')+
   '<div class="body"></div><div class="tf"><span title="查询上次运行时间">刷新 '+esc(hm(t.refreshed_at))+'</span><span title="源文件最近修改时间">数据 '+esc(hm(t.data_time))+'</span><span class="cnt"></span><span class="sp"></span>'+
   '<button type="button" class="qt" aria-expanded="false">查询</button><button type="button" class="csv">CSV</button></div>'+
   '<div class="q"><pre>'+esc(t.sql)+'</pre>'+(t.title_sql?'<div class="sub">标题查询：</div><pre>'+esc(t.title_sql)+'</pre>':'')+'<div class="sub" style="margin:0">来源文件</div><ul>'+src+'</ul>'+
   '<div class="sub" style="margin:4px 0 0">上次结果变化：'+esc(hm(t.changed_at))+'</div></div></article>'}
function drawAll(){D.tiles.forEach(drawTile)}
function controls(){const c=$('#controls');let h='';
  for(const f of D.filters){if(f.type==='select'){const vals=new Set();D.tiles.forEach(t=>{if(applies(t,f))objs(t).forEach(r=>{if(r[f.column]!=null)vals.add(String(r[f.column]))})});
      h+='<label>'+esc(f.label)+' <select data-f="'+esc(f.id)+'"><option value="">全部</option>'+[...vals].sort().map(v=>'<option>'+esc(v)+'</option>').join('')+'</select></label>'}
    else if(f.type==='daterange'){let ds=[];D.tiles.forEach(t=>{if(applies(t,f))objs(t).forEach(r=>{if(r[f.column])ds.push(String(r[f.column]).slice(0,10))})});ds.sort();
      h+='<label>'+esc(f.label)+' <input type="date" data-f="'+esc(f.id)+'" data-k="from" min="'+(ds[0]||'')+'" max="'+(ds[ds.length-1]||'')+'" value="'+(ds[0]||'')+'"> 至 <input type="date" data-f="'+esc(f.id)+'" data-k="to" min="'+(ds[0]||'')+'" max="'+(ds[ds.length-1]||'')+'" value="'+(ds[ds.length-1]||'')+'"></label>'}}
  if(D.grain)h+='<span class="seg" role="group" aria-label="粒度"><button type="button" data-g="daily">按日</button><button type="button" data-g="weekly">按周</button></span>';
  h+='<span style="flex:1"></span><button type="button" class="btn" id="reset">清除筛选</button><button type="button" class="btn" id="bundle">导出 JSON</button>';
  c.innerHTML=h;
  c.querySelectorAll('select[data-f]').forEach(e=>e.onchange=()=>{S.filters[e.dataset.f]=e.value;drawAll()});
  c.querySelectorAll('input[data-f]').forEach(e=>e.onchange=()=>{const o=S.filters[e.dataset.f]||{};o[e.dataset.k]=e.value;S.filters[e.dataset.f]=o;drawAll()});
  c.querySelectorAll('[data-g]').forEach(b=>{b.classList.toggle('on',b.dataset.g===S.grain);b.onclick=()=>{S.grain=b.dataset.g;c.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b));drawAll()}});
  $('#reset').onclick=()=>{S.filters={};controls();drawAll()};
  $('#bundle').onclick=()=>dl((D.name||'dashboard')+'-bundle.json',JSON.stringify({dashboard:D.title,exported_at:new Date().toISOString(),visibility:D.visibility,filters:S.filters,grain:S.grain,
     tiles:D.tiles.map((t,i)=>({id:t.id,type:t.type,title:t.title,sql:t.sql,refreshed_at:t.refreshed_at,columns:t.columns,rows:VIEWS[i].map(r=>t.columns.map(c=>r[c]))}))},null,1),'application/json')}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type||'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function csv(t,ti){const cols=t.columns.filter(c=>PRIV||c!=='_src');const q=v=>v==null?'':/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
  dl(t.id+'.csv','\ufeff'+cols.join(',')+'\n'+VIEWS[ti].map(r=>cols.map(c=>q(r[c])).join(',')).join('\n'))}
const pop=$('#pop');
function openPop(el){const ti=+el.dataset.t,ri=+el.dataset.r,col=el.dataset.c,t=D.tiles[ti],r=(VIEWS[ti]||[])[ri]||{};
  const v=r[col];const fv=fmt(v,(t.opts.columns||[]).find(c=>c.col===col)?.fmt||(col===t.opts.value||col===t.opts.y?t.opts.fmt:col===t.opts.delta?(t.opts.delta_fmt||'pct'):null));
  const rowtxt=Object.keys(r).filter(k=>!k.startsWith('_')&&k!==col).slice(0,8).map(k=>'<dt>'+esc(k)+'</dt><dd>'+(r[k]==null?'取不到':esc(String(r[k]).slice(0,120)))+'</dd>').join('');
  const src=r._label||((t.sources||[]).map(s=>s.label).join('; '))||'取不到';
  const loc=PRIV&&r._src?esc(r._src)+(r._line?' : '+esc(r._line):''):(r._line&&!PRIV&&!String(r._line).startsWith('/')?esc(r._line):'');
  const ask='请解释看板「'+(D.title||'')+'」里 tile「'+t.id+'」（'+(t.title||'')+'）的数字：'+col+' = '+(fv==null?'取不到':fv)+'。'+(r._label?'来源：'+r._label+(r._line?' #'+r._line:'')+'。':'')+'查询：'+t.sql.replace(/\s+/g,' ');
  pop.innerHTML='<h3>'+esc(t.title||t.id)+'</h3><div class="pv">'+(fv==null?'取不到':esc(fv))+'</div><dl><dt>字段</dt><dd><code>'+esc(col)+'</code>'+(r.__agg?'（'+esc(r.__agg)+'）':'')+'</dd><dt>来源</dt><dd>'+esc(src)+'</dd>'+(loc?'<dt>位置</dt><dd><code>'+loc+'</code></dd>':'')+
   '<dt>刷新</dt><dd>'+esc(t.refreshed_at||'取不到')+'（Asia/Shanghai）</dd>'+rowtxt+'</dl><div class="sub" style="margin:6px 0 0">生成这个数的查询</div><pre>'+esc(t.sql)+'</pre>'+
   '<div class="acts"><button class="btn" data-a="sql">复制查询</button><button class="btn fill" data-a="ask">复制提问（让 bot 解释）</button><button class="btn" data-a="x">关闭</button></div>';
  pop.hidden=false;const b=el.getBoundingClientRect();const pw=pop.offsetWidth,ph=pop.offsetHeight;
  let x=Math.min(window.innerWidth-pw-12,Math.max(12,b.left));let y=b.bottom+8;if(y+ph>window.innerHeight-8)y=Math.max(8,b.top-ph-8);pop.style.left=x+'px';pop.style.top=y+'px';
  pop.querySelector('[data-a=sql]').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(t.sql);
  pop.querySelector('[data-a=ask]').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(ask);
  pop.querySelector('[data-a=x]').onclick=()=>{pop.hidden=true}}
document.addEventListener('click',e=>{const n=e.target.closest('[data-n]');if(n){e.stopPropagation();openPop(n);return}if(!e.target.closest('#pop'))pop.hidden=true;
  const q=e.target.closest('.qt');if(q){const p=q.closest('.tile').querySelector('.q');p.classList.toggle('open');q.setAttribute('aria-expanded',p.classList.contains('open'));q.textContent=p.classList.contains('open')?'收起查询':'查询'}
  const c=e.target.closest('.csv');if(c){const id=c.closest('.tile').id.slice(5);const ti=D.tiles.findIndex(t=>t.id===id);csv(D.tiles[ti],ti)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')pop.hidden=true;if(e.key==='Enter'&&e.target.matches('[data-n]'))openPop(e.target)});
$('#theme').onclick=()=>{const d=document.documentElement;const cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';localStorage.setItem('dash-theme',d.dataset.theme)};
// header
document.title=D.title||document.title;$('#h1').innerHTML=D.conclusion_tile!=null&&D.conclusion?num(D.conclusion_tile,0,D.tiles[D.conclusion_tile].columns[0]||'',esc(D.conclusion)):esc(D.conclusion||D.title||'');$('#kicker').textContent=D.title||'';$('#lede').textContent=D.subtitle||'';
const vis=$('#vis');vis.textContent=PRIV?'私有 · 只存本机':'公开';vis.className='badge '+(PRIV?'private':'public');
$('#navlinks').innerHTML=(D.nav||[]).map(n=>'<a href="'+esc(n.href)+'">'+esc(n.label)+'</a>').join('');
$('#meta').innerHTML='全部查询刷新于 '+esc(D.refreshed_at||'取不到')+'（Asia/Shanghai）· 结果上次变化 '+esc(hm(D.last_changed_at))+(D.interval_min?' · 每 '+D.interval_min+' 分钟由 <code>dash refresh</code> 重跑':'')+(D.reload_min?' · 本页 <span id="cd"></span> 后自动重载':'');
$('#grid').innerHTML=D.tiles.map(tileShell).join('');
$('#foot').innerHTML='点任意数字看它来自哪条查询、哪个文件哪一行。数字取自本机存档，取不到的写「取不到」，不估算。'+(PRIV?'本页私有，不公开发布。':'公开页已去掉本机路径，只显示来源标签。')+' 渲染于 '+esc(D.rendered_at)+'。';
controls();drawAll();
const nav=$('#nav');const onS=()=>nav.classList.toggle('scrolled',scrollY>4);addEventListener('scroll',onS,{passive:true});onS();
if(D.reload_min){let left=D.reload_min*60;const cd=$('#cd');const tick=()=>{cd.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left--<=0)location.reload()};tick();setInterval(tick,1000)}
})();
</script>
</body></html>
